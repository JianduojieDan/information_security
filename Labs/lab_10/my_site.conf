server { 
    listen 8000; 
    server_name localhost; 
    root /var/www/html; # Path to your HTML file where it is located
    index content.html; # The default file to serve 

    location / { 
         proxy_pass http://www.google.com;

	 proxy_set_header Host $host;
	 proxy_set_header X-Real-IP $remote_addr; 
    } 
}
